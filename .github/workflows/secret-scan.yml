name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a secret introduced by a pattern the scanner learns later
    # is still caught without waiting for the next push.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan for sensitive values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still published.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tokens, keys, JWTs, private keys, tunnel URLs, hard-coded passwords,
      # internal TLDs, n8n credential and instance IDs, and any IPv4 address
      # outside the RFC 5737 documentation ranges.
      - name: Scan working tree
        run: python3 scripts/scan_sensitive_values.py

      - name: Re-verify the sanitized export in isolation
        run: |
          set -euo pipefail
          EXPORT=workflows/n8n/ai-soc-assistant/ai-soc-assistant.sanitized.json
          python3 - "$EXPORT" <<'PY'
          import json, sys
          wf = json.load(open(sys.argv[1]))
          problems = []
          if wf.get("active") is not False:
              problems.append("active must be false")
          for key in ("id", "versionId"):
              if key in wf:
                  problems.append(f"top-level '{key}' present")
          if isinstance(wf.get("meta"), dict) and "instanceId" in wf["meta"]:
              problems.append("meta.instanceId present")
          if wf.get("pinData"):
              problems.append("pinData present")
          for node in wf.get("nodes", []):
              for ctype, cred in (node.get("credentials") or {}).items():
                  cid = str(cred.get("id", ""))
                  if not cid.isupper() and "REPLACE" not in cid:
                      problems.append(f"node {node['name']!r} has a real-looking credential id")
          if problems:
              for p in problems:
                  print(f"::error file={sys.argv[1]}::{p}")
              sys.exit(1)
          print("Sanitized export clean.")
          PY

      - name: Fail-closed note
        if: failure()
        run: |
          echo "::error::Sensitive values detected. Rotate anything exposed BEFORE rewriting history."
          echo "See docs/secrets-management.md"
